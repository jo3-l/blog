- id: p-series
  category: math
  text: |
    There exists a complex sequence $(a_n)_n$ such that $\sum_{n \ge 0} a_n^k$ converges
    if and only if $k$ is prime.

    More generally, for any fixed subset $A \subseteq \mathbb{Z}^+$, there exists a complex sequence
    $(a_n)_n$ such that $\sum_{n \ge 0} a_n^k$ converges if and only if $k \in A$.
    ([Math Stack Exchange](https://math.stackexchange.com/q/3811480/1674765))

- id: divisibility-weird
  category: math
  text: |
    If $a(b+1)(ab+1)$ is a perfect square, then $(b+1)$ divides $a(ab+1)$.

    (I originally posed this as [a conjecture on Math Stack Exchange](https://math.stackexchange.com/q/5089072/1674765) based on computational evidence,
    and user [Mastrem](https://math.stackexchange.com/users/253433/mastrem) provided a proof using a clever descent argument.)

- id: string-lvalue
  category: programming
  text: |
    In C++, all literal expressions (e.g., `42`, `true`, `nullptr`) are prvalues, with the sole exception of string literals (e.g. `"hello world"`),
    which are lvalues. ([cppreference](https://en.cppreference.com/cpp/language/value_category#prvalue))

- id: quartic-composition
  category: math
  text: |
    A quartic polynomial $f$ can be expressed as the composition of two quadratic
    polynomials $g$ and $h$ (such that $f(x) = g(h(x))$) if and only if two of the
    roots of $f$ have the same sum as the other two. ([Math Stack Exchange](https://math.stackexchange.com/a/5147880/1674765))

- id: go-embedded-fields
  category: programming
  text: |
    In Go, [the following is not an error](https://go.dev/play/p/7SXi_RYsQo8):
    ```go
    type A struct { Field string }
    type B struct { Field int }
    type C struct { A; B }
    ```
    even though `C` embeds `A` and `B`, both of which declare a field called `Field`.

- id: additive-z-infty
  category: math
  text: |
    If $f : \mathbb{Z}^\infty \to \mathbb{Z}$ is an additive function that vanishes on all sequences of the form
    $(1, 0, 0, \dots)$, $(0, 1, 0, \dots)$, $(0, 0, 1, \dots)$, and so on, then $f$ is the zero function.
    ([Math Stack Exchange](https://math.stackexchange.com/q/1082165/1674765))

    If this seems obvious, note that the statement is _false_ for $f : \mathbb{Z}^\infty \to \mathbb{Q}$ under AC.

- id: heapsort
  category: programming
  text: |
    It's well known that heapsort has worst-case runtime $\Theta(n \log n)$. But the _best-case_ runtime for heapsort
    is also $\Theta(n \log n)$ (assuming distinct keys), and this was only proved several decades after heapsort's invention.
    (["On the Best Case of Heapsort"](https://www.math.cmu.edu/~af1p/Texfiles/Best.pdf))

