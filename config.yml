baseURL: https://jo3-l.dev
title: Joe's Blog
copyright: Content licensed under CC-BY-SA
theme: PaperMod
pagination:
  pagerSize: 5

params:
  homeInfoParams:
    title: Hi, I'm Joseph.
    content: |
      I study computer science and pure mathematics at the University of Waterloo. Welcome to my small slice of the web :)
      In addition to longer-form blogs, I also post shorter notes and links to pieces I enjoyed on the [tidbits page](/tidbits).

      Perhaps you'd like to learn a bit more [about me](/about). To get in touch, email me at jliu1602 [at] gmail.com;
      I am also active on Discord as jo3_l.

  title: Joe's Blog
  author: Joseph Liu
  description:
    My small slice of the web—occasional musings on math, programming,
    and other topics
  dateFormat: "02 January 2006"
  social: true
  socialIcons:
    - name: github
      url: https://github.com/jo3-l/
    - name: email
      url: mailto:jliu1602@gmail.com
    - name: discord
      url: https://discord.com/users/621907351267442698
    - name: lobsters
      url: https://lobste.rs/~jo3_l
    - name: linkedin
      url: https://www.linkedin.com/in/joseph-h-liu/
  showCodeCopyButtons: true

cascade:
  - target:
      path: /posts/**
    params:
      ShowToc: true

menu:
  main:
    - identifier: Home
      name: Home
      url: /
      weight: 1
    - identifier: about
      name: About
      url: /about/
      weight: 2
    - identifier: tidbits
      name: Tidbits
      url: /tidbits/
      weight: 3

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - $$
              - $$
          inline:
            - - $
              - $
